<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配图与来源 · Green Campus</title><style>body{margin:0;background:#f5f6f0;color:#16372c;font:16px/1.6 system-ui}header,main{max-width:1200px;margin:auto;padding:36px 24px}h1{font-size:42px;margin:16px 0}a{color:#195e45}#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}article{background:white;border:1px solid #dde3d7;border-radius:22px;padding:20px}h2{margin:0 0 6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{width:100%;height:170px;object-fit:contain;background:#eff1eb;border-radius:12px}figcaption{font-size:12px;overflow-wrap:anywhere}small{display:block;color:#52685c}footer{padding:30px;text-align:center}@media(max-width:800px){#gallery{grid-template-columns:1fr}}</style><header><a href="index.html#words">← 返回图片词汇环</a><h1>看图，把单词放回生活。</h1><p>27 组词汇，每组两张线索图。以下保留原图页面、作者与许可信息；图片裁切与组合仅用于本课件的教学呈现。</p><small>抽象词的照片是情境提示，并非词义本身。例如 otherwise 需要结合“正确分类，否则造成污染”的对比理解。</small></header><main id="gallery"></main><footer>交互参考：<a href="https://reactbits.dev/micro/code-slots">React Bits · CodeSlots</a> · <a href="https://motionsites.ai">MotionSites</a>。CodeSlots 已适配英文字母、词组和保留错答。</footer><script src="vocabulary.js"></script><script>const root=document.querySelector('#gallery');const el=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n};for(const w of window.VOCABULARY){const card=el('article');card.append(el('h2',w.word),el('small',w.ipa+' · '+w.meaning));const pair=el('div');pair.className='pair';for(const im of w.images){const f=el('figure'),img=el('img');img.src=im.local;img.alt=im.caption;const c=el('figcaption'),a=el('a',im.title);a.href=im.sourcePage;a.target='_blank';a.rel='noopener';c.append(el('p',im.caption),a,el('small',im.author||'作者信息见原图页面'));const lic=el('a',im.license||'许可见原图页面');lic.href=im.licenseUrl||im.sourcePage;lic.target='_blank';lic.rel='noopener';c.append(lic);f.append(img,c);pair.append(f)}card.append(pair);root.append(card)}</script></html>
