  <main>
    <header>
      <h1>直接保存作业文件夹</h1>
      <p>无需解压、无需 QQ、无需登录，文件按原来的目录保存。</p>
      <ol class="steps"><li>点击“保存作业文件夹”。</li><li>选择存放位置，例如“下载”，然后允许保存。</li><li>等待出现“保存完成”，打开其中的“作业”文件夹。</li></ol>
      <button class="primary" id="save" type="button">保存作业文件夹</button>
      <p class="support" id="support">请使用电脑上的 Chrome 或 Edge 浏览器打开。</p>
      <div class="status" id="status" role="status" aria-live="polite">正在准备文件…</div>
      <progress id="progress" value="0" max="17" aria-label="文件保存进度" hidden></progress>
    </header>

  <script>
  'use strict';
  const files = JSON.parse(document.getElementById('file-data').textContent);
  const saveButton = document.getElementById('save');
  const statusBox = document.getElementById('status');
  const progress = document.getElementById('progress');
  const supported = typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
  function fileBytes(file) {
    const binary = atob(file.base64);
    return Uint8Array.from(binary, character => character.charCodeAt(0));
  }
  function setStatus(text, tone = '') { statusBox.textContent = text; statusBox.dataset.tone = tone; }
  async function unusedFolder(parent) {
    for (let number = 1; number <= 1000; number++) {
      const name = number === 1 ? '作业' : `作业 (${number})`;
      try { await parent.getDirectoryHandle(name); }
      catch (error) {
        if (error.name === 'TypeMismatchError') continue;
        if (error.name !== 'NotFoundError') throw error;
        return { handle: await parent.getDirectoryHandle(name, { create: true }), name };
      }
    }
    throw new Error('该位置已经有很多同名文件夹，请选择其他存放位置。');
  }
  async function saveProject() {
    if (!supported) return;
    let completed = 0;
    saveButton.disabled = true;
    progress.value = 0;
    progress.max = files.length;
    progress.hidden = true;
    try {
      const parent = await window.showDirectoryPicker({ id: 'gengqiu-homework-download', mode: 'readwrite', startIn: 'downloads' });
      const folder = await unusedFolder(parent);
      progress.hidden = false;
      for (const file of files) {
        const parts = file.path.split('/');
        if (parts.some(part => !part || part === '.' || part === '..')) throw new Error('文件路径无效。');
        let directory = folder.handle;
        for (const name of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(name, { create: true });
        setStatus(`正在保存 ${completed + 1}/${files.length}：${file.path}`);
        const handle = await directory.getFileHandle(parts[parts.length - 1], { create: true });
        const writable = await handle.createWritable();
        try { await writable.write(fileBytes(file)); await writable.close(); }
        catch (error) { try { await writable.abort(); } catch {} throw error; }
        completed++;
        progress.value = completed;
      }
      setStatus(`保存完成！已将 ${files.length} 个文件保存到你选择的位置中的“${folder.name}”文件夹，可直接打开，无需解压。`, 'success');
    } catch (error) {
      if (error.name === 'AbortError' && completed === 0) setStatus('已取消选择存放位置。可以再次点击按钮。');
      else if (error.name === 'NotAllowedError' || error.name === 'SecurityError') setStatus(`没有获得文件夹写入权限。请选择“下载”或自己新建的文件夹，并允许保存。已保存 ${completed}/${files.length} 个文件。`, 'error');
      else setStatus(`保存未完成（${completed}/${files.length} 个文件）：${error.message || '请重新选择存放位置。'}`, 'error');
    } finally { saveButton.disabled = false; }
  }
  saveButton.addEventListener('click', saveProject);
  const fileList = document.getElementById('files');
  for (const file of files) {
    const li = document.createElement('li');
    const label = document.createElement('span'); label.className = 'filename'; label.textContent = file.path;
    const size = document.createElement('span'); size.className = 'size'; size.textContent = `${file.size} 字节`; label.append(size);
    const link = document.createElement('a'); link.className = 'download'; link.textContent = '下载';
    link.download = file.path.split('/').pop(); link.href = URL.createObjectURL(new Blob([fileBytes(file)], { type: 'application/octet-stream' }));
    li.append(label, link); fileList.append(li);
  }
  if (supported) setStatus(`已准备好 ${files.length} 个文件。点击上方按钮，选择保存位置即可。`);
  else {
    saveButton.hidden = true;
    document.getElementById('support').textContent = '此浏览器不支持直接保存完整文件夹。请在电脑的 Chrome 或 Edge 中打开本页，或从下方逐个下载。';
    document.getElementById('individual').open = true;
    setStatus('文件已准备好，可在下方逐个下载。');
  }
  </script>
